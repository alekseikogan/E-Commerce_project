# L7: nginx смотрит HTTP и раскидывает запросы по трём web.
# Имена mele_shop-web-N появляются при: --scale web=3 (project name: mele_shop)

upstream django {
    # round-robin по умолчанию; least_conn — у кого меньше живых соединений
    # least_conn;
    server mele_shop-web-1:8000 max_fails=1 fail_timeout=10s;
    server mele_shop-web-2:8000 max_fails=1 fail_timeout=10s;
    server mele_shop-web-3:8000 max_fails=1 fail_timeout=10s;
}

server {
    listen 80;
    server_name _;

    location /health/ {
        proxy_pass http://django;
        proxy_set_header Host $http_host;
        add_header X-Upstream $upstream_addr always;
    }

    location /static/ {
        alias /var/www/static/;
        access_log off;
        expires 7d;
    }

    location /media/ {
        alias /var/www/media/;
        access_log off;
        expires 7d;
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        add_header X-Upstream $upstream_addr always;
    }
}
