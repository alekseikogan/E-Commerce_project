# Overlay поверх docker-compose.yml: 3× web + nginx L7.
# Не смешивать с docker-compose.zdd.yml (оба хотят порт 8088).
#
# docker compose -f docker-compose.yml -f docker-compose.lb.yml up -d --build --scale web=3

services:
  nginx-lb:
    image: nginx:alpine
    container_name: mele_shop_nginx_lb
    ports:
      - "8088:80"
    volumes:
      - ./nginx/lb.conf:/etc/nginx/conf.d/default.conf:ro
      - ../myshop/static:/var/www/static:ro
      - ../myshop/media:/var/www/media:ro
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  web:
    # scale не работает с фиксированным container_name / портом 8000 на хосте
    container_name: !reset null
    ports: !reset []
    command: gunicorn myshop.wsgi:application --bind 0.0.0.0:8000 --workers 2 --access-logfile -
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
